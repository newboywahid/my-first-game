name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download J2ME libraries
        run: |
          curl -L -o cldc.jar https://repo1.maven.org/maven2/org/microemu/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar
          curl -L -o midp.jar https://repo1.maven.org/maven2/org/microemu/microemu-midp/2.0.4/microemu-midp-2.0.4.jar
      - name: Compile
        run: |
          mkdir classes
          javac -source 1.3 -target 1.3 -classpath cldc.jar:midp.jar -d classes src/*.java
          cp src/*.png classes/
      - name: Package
        run: |
          printf 'MIDlet-1: Game,,Game\nMIDlet-Name: Game\nMIDlet-Vendor: Me\nMIDlet-Version: 1.0\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n' > manifest.txt
          jar cfm game.jar manifest.txt -C classes .
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: game.jar
